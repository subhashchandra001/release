[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privatemap-bench"
version = "0.1.0"
description = "A one-robot benchmark for measuring privacy leakage in indoor SLAM map sharing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "pyyaml",
  "opencv-python",
  "matplotlib",
  "scikit-image",
  "scikit-learn",
  "Pillow",
  "tqdm",
  "networkx",
  "shapely",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]
geo = ["geopandas", "open3d"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
