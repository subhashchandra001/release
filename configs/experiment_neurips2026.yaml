      keyframes_csv: data/processed/env1_B_relocalization/keyframes.csv
      detections_csv: data/processed/env1_B_relocalization/detections.csv
    - run_id: env1_C_object_proxy
      environment_id: env1
      purpose: object_proxy
      map_yaml: data/processed/env1_A_mapping/map.yaml
      trajectory_csv: data/processed/env1_C_object_proxy/trajectory.csv
      keyframes_csv: data/processed/env1_C_object_proxy/keyframes.csv
      detections_csv: data/processed/env1_C_object_proxy/detections.csv
    - run_id: env1_D_repeated_route
      environment_id: env1
      purpose: repeated_route
      map_yaml: data/processed/env1_A_mapping/map.yaml
      trajectory_csv: data/processed/env1_D_repeated_route/trajectory.csv
      keyframes_csv: data/processed/env1_D_repeated_route/keyframes.csv
      detections_csv: data/processed/env1_D_repeated_route/detections.csv
    - run_id: env1_E_privacy_stress
      environment_id: env1
      purpose: privacy_stress
      map_yaml: data/processed/env1_A_mapping/map.yaml
      trajectory_csv: data/processed/env1_E_privacy_stress/trajectory.csv
