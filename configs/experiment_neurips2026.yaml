experiment:
  name: privatemap_bench_neurips2026
  anonymous: true
  random_seed: 7
  robot: turtlebot4
  collection_mode: repeated_single_robot_runs_multi_environment
  runs:
    - run_id: env1_A_mapping
      environment_id: env1
      purpose: mapping
      map_yaml: data/processed/env1_A_mapping/map.yaml
      trajectory_csv: data/processed/env1_A_mapping/trajectory.csv
      keyframes_csv: data/processed/env1_A_mapping/keyframes.csv
      detections_csv: data/processed/env1_A_mapping/detections.csv
    - run_id: env1_B_relocalization
      environment_id: env1
      purpose: relocalization
      map_yaml: data/processed/env1_A_mapping/map.yaml
